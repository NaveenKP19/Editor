<div class="dialog-header">
    <div class="header-title">
      <mat-icon class="header-icon">draw</mat-icon>
      <span>Edit Signature</span>
    </div>
  </div>

<div class="ribbon-container">
  <!-- Ribbon Tabs Header -->
  <div class="ribbon-tabs">
    <button 
      class="tab-btn" 
      [class.active]="activeTab === 'format'" 
      (click)="activeTab = 'format'">
      Format text
    </button>
    <button 
      class="tab-btn" 
      [class.active]="activeTab === 'insert'" 
      (click)="activeTab = 'insert'">
      Insert
    </button>
  </div>

  <!-- Ribbon Toolbar Card -->
  <div class="ribbon-card">

    <!-- ======================================================= -->
    <!-- TAB 1: FORMAT TEXT                                      -->
    <!-- ======================================================= -->
    <ng-container *ngIf="activeTab === 'format'">
      
      <!-- Clipboard Group -->
      <div class="ribbon-group">
        <div class="group-content clipboard-layout">
          <div class="vertical-actions">
           <button mat-button (mousedown)="$event.preventDefault()" (click)="cutObject()" class="ribbon-btn-text">
            <mat-icon>content_cut</mat-icon>
            <span>Cut</span>
            </button>
           <button mat-button (mousedown)="$event.preventDefault()" (click)="copyObject()" class="ribbon-btn-text">
            <mat-icon>content_copy</mat-icon>
            <span>Copy</span>
          </button>
          </div>

          <button mat-button (click)="pasteObject()" class="format-painter-btn">
            <mat-icon class="highlight-icon">content_paste</mat-icon>
            <span class="btn-text">Paste</span>
          </button>
        </div>
        <div class="group-title">Clipboard</div>
      </div>

      <div class="ribbon-divider"></div>

      <!-- Basic Text Group -->
      <div class="ribbon-group">
        <div class="group-rows">
          <!-- Row 1: Font controls -->
          <div class="group-row">
            <mat-form-field appearance="outline" class="font-box compact-field">
              <mat-select [(ngModel)]="fontFamily" (selectionChange)="changeFontFamily()">
                <mat-option value="Arial">Arial</mat-option>
                <mat-option value="Aptos">Aptos</mat-option>
                <mat-option value="Calibri">Calibri</mat-option>
                <mat-option value="Verdana">Verdana</mat-option>
                <mat-option value="Tahoma">Tahoma</mat-option>
                <mat-option value="Times New Roman">Times New Roman</mat-option>
              </mat-select>
            </mat-form-field>

        <div class="font-size-control">
        <input type="number" appearance="outline" [(ngModel)]="fontSize" min="1" class="font-size-input" (change)="changeFontSize()" (keydown.enter)="changeFontSize()" />
          <button mat-icon-button type="button" class="font-size-dropdown-btn" [matMenuTriggerFor]="fontSizeMenu">
          <mat-icon>arrow_drop_down</mat-icon>
      </button>
        </div>

            <mat-menu #fontSizeMenu="matMenu">
              <button mat-menu-item *ngFor="let s of fontSizes" (click)="fontSize = s; changeFontSize()">
                {{ s }}
              </button>
            </mat-menu>

            <button mat-icon-button class="icon-btn-sm" (click)="increaseFont()" title="Increase font size">
              <mat-icon>text_increase</mat-icon>
            </button>

            <button mat-icon-button class="icon-btn-sm" (click)="decreaseFont()" title="Decrease font size">
              <mat-icon>text_decrease</mat-icon>
            </button>

            <button mat-icon-button class="icon-btn-sm" (click)="clearFormatting()" title="Clear formatting">
              <mat-icon>auto_fix_normal</mat-icon>
            </button>
          </div>

          <!-- Row 2: Formatting controls -->
          <div class="group-row">
             <button mat-button (click)="addText()" class="ribbon-btn-text">
            <mat-icon>title</mat-icon>
            <span>Text Box</span>
          </button>

                        <button
                mat-icon-button
                class="icon-btn-sm"
                (mousedown)="$event.preventDefault()"
                (click)="toggleBold()"
                title="Bold">
                <mat-icon>format_bold</mat-icon>
              </button>

              <button
                mat-icon-button
                class="icon-btn-sm"
                (mousedown)="$event.preventDefault()"
                (click)="toggleItalic()"
                title="Italic">
                <mat-icon>format_italic</mat-icon>
              </button>

              <button
                mat-icon-button
                class="icon-btn-sm"
                (mousedown)="$event.preventDefault()"
                (click)="toggleUnderline()"
                title="Underline">
                <mat-icon>format_underlined</mat-icon>
              </button>

              <button
                mat-icon-button
                class="icon-btn-sm"
                (mousedown)="$event.preventDefault()"
                (click)="toggleStrike()"
                title="Strikethrough">
                <mat-icon>strikethrough_s</mat-icon>
              </button>

            <label class="color-picker-btn" title="Highlight Color">
              <mat-icon class="yellow-underline">border_color</mat-icon>
              <input type="color" [(ngModel)]="fillColor" (mousedown)="$event.stopPropagation()" (input)="changeFillColor()">
            </label>

            <label class="color-picker-btn" title="Font Color">
              <mat-icon class="red-underline">format_color_text</mat-icon>
              <input type="color" [(ngModel)]="fontColor" (mousedown)="$event.stopPropagation()" (input)="changeFontColor()">
            </label>
          </div>

        </div>
        <div class="group-title">Basic Text</div>
      </div>

      <div class="ribbon-divider"></div>

      <!-- Paragraph Group -->
      <div class="ribbon-group">
        <div class="group-rows">
          <!-- Row 1 -->
          <div class="group-row">
            <button mat-icon-button class="icon-btn-sm" (click)="bulletList()" title="Bullets">
              <mat-icon>format_list_bulleted</mat-icon>
            </button>

            <button mat-icon-button class="icon-btn-sm" (click)="numberList()" title="Numbering">
              <mat-icon>format_list_numbered</mat-icon>
            </button>
          </div>

          <!-- Row 2 -->
          <div class="group-row">
            <button mat-icon-button class="icon-btn-sm" (click)="alignLeft()" title="Align left">
              <mat-icon>format_align_left</mat-icon>
            </button>

            <button mat-icon-button class="icon-btn-sm" (click)="alignCenter()" title="Align center">
              <mat-icon>format_align_center</mat-icon>
            </button>

            <button mat-icon-button class="icon-btn-sm" (click)="alignRight()" title="Align right">
              <mat-icon>format_align_right</mat-icon>
            </button>

            <button mat-icon-button class="icon-btn-sm" (click)="alignJustify()" title="Justify">
              <mat-icon>format_align_justify</mat-icon>
            </button>
          </div>

        </div>
        <div class="group-title">Paragraph</div>
      </div>
    </ng-container>

    <!-- ======================================================= -->
    <!-- TAB 2: INSERT                                           -->
    <!-- ======================================================= -->
    <ng-container *ngIf="activeTab === 'insert'">

      <!-- Text & Media Group -->
      <div class="ribbon-group">
        <div class="group-content flex-rowGap">


          <!-- Hidden File Input for Upload Image -->
          <input #fileInput type="file" accept="image/*" (change)="uploadImage($event)" style="display: none;">
          <button mat-button (click)="fileInput.click()" class="ribbon-btn-text">
            <mat-icon>image</mat-icon>
            <span>Image</span>
          </button>
        </div>
        <div class="group-title">Elements</div>
      </div>

      <div class="ribbon-divider"></div>

      <!-- Shapes Group -->
      <div class="ribbon-group">
        <div class="group-content flex-rowGap">
          <button mat-button (click)="addLine()" class="ribbon-btn-text">
            <mat-icon>horizontal_rule</mat-icon>
            <span>Line</span>
          </button>
        </div>
        <div class="group-title">Shapes</div>
      </div>

      <div class="ribbon-divider"></div>

      <!-- Actions Group -->
      <div class="ribbon-group">
        <div class="group-content flex-rowGap">
          <button mat-button (click)="duplicateObject()" class="ribbon-btn-text">
            <mat-icon>control_point_duplicate</mat-icon>
            <span>Duplicate</span>
          </button>

          <button mat-button (click)="deleteObject()" class="ribbon-btn-text warn-text">
            <mat-icon>delete</mat-icon>
            <span>Delete</span>
          </button>
        </div>
        <div class="group-title">Actions</div>
      </div>

    </ng-container>

    <div class="spacer"></div>
    <button
    mat-raised-button
    color="accent"
    [matMenuTriggerFor]="downloadMenu">

    <mat-icon>download</mat-icon>
    Download

</button>

<mat-menu #downloadMenu="matMenu">

    <button mat-menu-item (click)="downloadFile('png')">
        <mat-icon>image</mat-icon>
        <span>Download PNG</span>
    </button>

    <button mat-menu-item (click)="downloadFile('jpeg')">
        <mat-icon>photo</mat-icon>
        <span>Download JPEG</span>
    </button>

    <button mat-menu-item (click)="downloadFile('pdf')">
        <mat-icon>picture_as_pdf</mat-icon>
        <span>Download PDF</span>
    </button>

    <button mat-menu-item (click)="downloadFile('json')">
        <mat-icon>data_object</mat-icon>
        <span>Download JSON</span>
    </button>

    <button mat-menu-item (click)="downloadFile('html')">
        <mat-icon>code</mat-icon>
        <span>Download HTML</span>
    </button>

</mat-menu>

  </div>
</div>

<div class="signname">
  <!-- Canvas Body -->
  <div class="designer">
    <div class="canvas-container">
      <canvas id="signatureCanvas"></canvas>
    </div>
  </div>
</div>

<!-- Bottom Dialog Actions -->
<div mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button mat-dialog-close>Cancel</button>
  <button 
    mat-raised-button 
    color="primary" 
  (click)="saveSignature()" 
  >
    Save Signature
  </button>
</div>
